<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>吃貨哲學家｜10秒有聲數位城市明信片生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121214; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
      display: flex; height: 100dvh; overflow: hidden;
    }

    #sidebar {
      width: 410px; background: #1c1c20; border-right: 1px solid #2e2e34;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      z-index: 10; overflow-y: auto; flex-shrink: 0;
    }
    #stage {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #09090b; position: relative; padding: 16px;
    }

    @media (max-width: 850px) {
      body { flex-direction: column-reverse; }
      #stage {
        flex: none; height: 38dvh; width: 100%; padding: 8px 12px;
        border-bottom: 1px solid #2e2e34;
      }
      #sidebar {
        width: 100%; height: 62dvh; border-right: none;
        padding: 14px; gap: 10px;
      }
      #canvas-wrap.landscape { width: auto !important; height: 82% !important; aspect-ratio: 16 / 9; }
      #canvas-wrap.portrait { height: 86% !important; width: auto !important; aspect-ratio: 9 / 16; }
      #hud-bar { margin-top: 5px; font-size: 11px; gap: 10px; }
    }

    .header-box {
      border-bottom: 1px solid #2e2e34; padding-bottom: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    h1 { font-size: 17px; color: #fbbf24; letter-spacing: 1px; }
    .sub { font-size: 11.5px; color: #a1a1aa; margin-top: 2px; }

    .section {
      background: #25252a; border-radius: 8px; padding: 11px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sec-title {
      font-size: 12.5px; font-weight: 700; color: #e4e4e7;
      display: flex; justify-content: space-between; align-items: center;
    }
    .badge {
      background: #3f3f46; color: #fbbf24; font-size: 10.5px;
      padding: 2px 6px; border-radius: 4px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11.5px; color: #a1a1aa; }
    input[type="text"], textarea, select {
      background: #161619; border: 1px solid #3f3f46; border-radius: 6px;
      color: #f4f4f5; padding: 7px 9px; font-size: 12.5px; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #fbbf24; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .file-btn {
      background: #2e2e36; border: 1px dashed #52525b; border-radius: 6px;
      padding: 9px 8px; font-size: 12.5px; color: #e4e4e7; cursor: pointer;
      text-align: center; transition: 0.2s; display: block;
    }
    .file-btn:hover { border-color: #fbbf24; color: #fbbf24; }
    .file-btn.loaded { border-style: solid; border-color: #10b981; color: #34d399; background: rgba(16, 185, 129, 0.08); }

    .storyboard-box {
      background: #161619; border: 1px solid #3f3f46; border-radius: 6px;
      padding: 8px; font-size: 11.5px; color: #d4d4d8; line-height: 1.5;
      white-space: pre-line; max-height: 130px; overflow-y: auto;
    }
    .btn-mini {
      background: #3f3f46; color: #fbbf24; border: none; border-radius: 4px;
      padding: 4px 9px; font-size: 11px; cursor: pointer; font-weight: 600;
    }
    .btn-mini:hover { background: #52525b; }
    .btn-reset {
      background: #2e2e36; color: #a1a1aa; border: 1px solid #3f3f46;
      border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .btn-reset:hover { color: #f87171; border-color: #f87171; }

    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 6px;
      font-weight: 700; font-size: 13.5px; cursor: pointer; transition: 0.2s;
    }
    #btnPlay { background: #3b82f6; color: white; }
    #btnPlay:hover { background: #2563eb; }
    #btnRecord { background: #ef4444; color: white; }
    #btnRecord:hover { background: #dc2626; }
    #btnRecord:disabled { background: #52525b; cursor: not-allowed; }
    input[type="range"] { width: 100%; accent-color: #fbbf24; height: 22px; }

    #canvas-wrap {
      box-shadow: 0 20px 55px rgba(0,0,0,0.9);
      border: 1px solid #3f3f46; overflow: hidden; background: #000;
      transition: all 0.3s ease; position: relative;
    }
    #canvas-wrap.landscape { width: min(88%, 1040px); aspect-ratio: 16 / 9; }
    #canvas-wrap.portrait { height: 86vh; aspect-ratio: 9 / 16; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
    #error-overlay {
      position: absolute; inset: 0; background: rgba(15,15,18,0.92); color: #fca5a5;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; font-size: 13.5px; text-align: center; line-height: 1.65; z-index: 20;
    }
    #hud-bar {
      margin-top: 8px; font-size: 12px; color: #a1a1aa;
      display: flex; gap: 18px; align-items: center;
    }
    #status { font-size: 12px; color: #34d399; line-height: 1.45; min-height: 18px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div class="header-box">
      <div>
        <h1>吃貨哲學家｜10秒有聲城市明信片</h1>
        <div class="sub">1照片 ＋ 1音檔 ＋ 1金句 · 人機協作多模態產出</div>
      </div>
      <button id="btnReset" class="btn-reset" title="清除暫存恢復預設值">清空重填</button>
    </div>

    <div class="section">
      <div class="sec-title"><span>1. 上傳採集素材</span><span class="badge">照片 + 配樂</span></div>
      <div class="grid-2">
        <label id="lblPhoto" class="file-btn">
          選取美食照片
          <input type="file" id="photoInput" accept="image/*" style="display:none;" />
        </label>
        <label id="lblAudio" class="file-btn">
          選取AI配樂音檔 (選用)
          <input type="file" id="audioInput" accept="audio/*" style="display:none;" />
        </label>
      </div>
    </div>

    <div class="section">
      <div class="sec-title"><span>2. 明信片文案與課程版標註</span><span class="badge">直接印上明信片</span></div>
      <div class="grid-2">
        <div class="field">
          <label>地點標記</label>
          <input type="text" id="inLocation" value="基隆七堵" />
        </div>
        <div class="field">
          <label>採集店家名稱</label>
          <input type="text" id="inShop" value="橙憶饅鰻早午餐店" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>美食名稱（料理品項）</label>
          <input type="text" id="inFood" value="豬里肌雞蛋餅" />
        </div>
        <div class="field">
          <label>自訂現場感官關鍵字（副標）</label>
          <input type="text" id="inSensoryTag" value="微雨清晨 · 焦香酥脆" />
        </div>
      </div>
      <div class="field">
        <label>吃貨哲學金句（人機協作共創）</label>
        <textarea id="inQuote" rows="2">如油煎脆皮，有了裂隙，才淌出豐潤多汁。</textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>吃貨（班級座號／姓名）</label>
          <input type="text" id="inAuthor" value="商一甲 01 號 王小明" />
        </div>
        <div class="field">
          <label>課程名稱前綴</label>
          <input type="text" id="inCourse" value="基隆商工《吃貨哲學家》" />
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-title"><span>3. 自由光影與感官視覺設計</span><span class="badge">冷熱甜鹹皆可搭</span></div>
      <div class="grid-2">
        <div class="field">
          <label>敘事路線結構</label>
          <select id="selRoute">
            <option value="route">三站尋味（商工→慶濟宮→美食）</option>
            <option value="solo">純粹凝視（單張美食微距）</option>
          </select>
        </div>
        <div class="field">
          <label>輸出畫面比例</label>
          <select id="selAspect">
            <option value="landscape">16:9 橫式明信片</option>
            <option value="portrait">9:16 直式短影音</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>光影色溫調色盤</label>
          <select id="selMood">
            <option value="morning">晴朗晨光（暖白明媚）</option>
            <option value="fresh">清新自然（柔和日常）</option>
            <option value="rain">陰雨濕潤（冷藍微霧）</option>
            <option value="sunset">黃昏夕照（橘紅餘暉）</option>
            <option value="night">深夜暖燈（暗調聚光）</option>
          </select>
        </div>
        <div class="field">
          <label>食物感官物理粒子</label>
          <select id="selSensory">
            <option value="steam">熱氣蒸騰（熱食升溫蒸汽）</option>
            <option value="crisp">油亮金光（炸烤酥脆星芒）</option>
            <option value="chill">沁涼寒氣（冰品冷飲下沉霧）</option>
            <option value="sweet">糖霜微塵（甜點溫潤光點）</option>
            <option value="none">純淨寫實（無粒子特效）</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>運鏡語法</label>
          <select id="selCam">
            <option value="dolly">溫柔推近（聚焦細節）</option>
            <option value="breath">微幅呼吸（手持溫度）</option>
            <option value="crane">低角仰望（崇高儀式）</option>
          </select>
        </div>
        <div class="field">
          <label>金句字體氣質</label>
          <select id="selFont">
            <option value="serif">典雅明體（思辨哲理）</option>
            <option value="maru">圓潤手寫（日常溫度）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">
        <span>4. 本片導演分鏡設計表（自動同步）</span>
        <button id="btnCopyPlan" class="btn-mini">複製設計表</button>
      </div>
      <div id="storyboardOutput" class="storyboard-box"></div>
    </div>

    <div class="section">
      <div class="sec-title">
        <span>5. 預覽與輸出影片</span>
        <strong id="timeLabel" style="color:#fbbf24;">00.0s / 10.0s</strong>
      </div>
      <input type="range" id="scrubber" min="0" max="10" step="0.05" value="0" />
      <div class="grid-2">
        <button id="btnPlay" class="btn">暫停 / 播放</button>
        <button id="btnRecord" class="btn">匯出 10 秒影片</button>
      </div>
      <div id="status">準備就緒！輸入內容會自動暫存於此裝置，避免誤關遺失。</div>
    </div>
  </div>

  <div id="stage">
    <div id="canvas-wrap" class="landscape">
      <div id="error-overlay"></div>
    </div>
    <div id="hud-bar">
      <span id="hudShot">Shot 1 起點・國立基隆商工</span>
      <span id="hudRes">1920 × 1080 (16:9)</span>
    </div>
  </div>

<script>
window.addEventListener('error', function(e) {
  const errBox = document.getElementById('error-overlay');
  if (errBox) {
    errBox.style.display = 'flex';
    errBox.innerHTML = '<strong>系統執行異常</strong><br>' + (e.message || '未知錯誤') + '<br><small>請確認網路連線或重新整理頁面。</small>';
  }
});

(function() {
  const DURATION = 10.0;
  let renderW = 1920;
  let renderH = 1080;
  let currentTime = 0;
  let isPlaying = true;
  let isRecording = false;
  let lastMs = performance.now();
  let lastQuoteProgress = -1;
  let lastBeatIdx = -1;
  let cardPopPlayed = false;

  const DEFAULT_STATE = {
    route: 'route',
    aspect: 'landscape',
    cam: 'dolly',
    mood: 'morning',
    sensory: 'steam',
    font: 'serif',
    location: '基隆七堵',
    shop: '橙憶饅鰻早午餐店',
    food: '豬里肌雞蛋餅',
    sensoryTag: '微雨清晨 · 焦香酥脆',
    author: '商一甲 01 號 王小明',
    course: '基隆商工《吃貨哲學家》',
    quote: '如油煎脆皮，有了裂隙，才淌出豐潤多汁。'
  };

  const state = {
    ...DEFAULT_STATE,
    userPhotoImg: null,
    audioFileName: '系統內建柔和木琴與紙雕音效'
  };

  const STORAGE_KEY = 'foodie_philosopher_postcard_v4';
  function loadLocalDraft() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && typeof saved === 'object') {
          Object.keys(DEFAULT_STATE).forEach(k => {
            if (typeof saved[k] === 'string') state[k] = saved[k];
          });
        }
      }
    } catch (_) {}
  }
  function saveLocalDraft() {
    try {
      const toSave = {};
      Object.keys(DEFAULT_STATE).forEach(k => { toSave[k] = state[k]; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    } catch (_) {}
  }
  loadLocalDraft();

  function getCourseCreditLine() {
    const coursePrefix = (state.course || '基隆商工《吃貨哲學家》').trim();
    const eaterName = (state.author || '吃貨').trim();
    return `${coursePrefix}｜ ${eaterName} × AI 協作創作`;
  }

  // ============================================================================
  // 第一階段：優先初始化左側表單與「導演分鏡設計表」（完全獨立於 WebGL，保證 100% 顯示）
  // ============================================================================
  const statusEl = document.getElementById('status');
  const timeLabel = document.getElementById('timeLabel');
  const scrubber = document.getElementById('scrubber');
  const hudShot = document.getElementById('hudShot');
  const wrap = document.getElementById('canvas-wrap');

  function updateStoryboardSheet() {
    const camMap = { dolly: '溫柔推近', breath: '微幅呼吸', crane: '低角仰望' };
    const moodMap = { morning: '晴朗晨光', fresh: '清新自然', rain: '陰雨濕潤', sunset: '黃昏夕照', night: '深夜暖燈' };
    const sensoryMap = { steam: '熱氣蒸騰', crisp: '油亮金光', chill: '沁涼寒氣', sweet: '糖霜微塵', none: '純淨寫實' };
    const aspectText = state.aspect === 'landscape' ? '16:9 橫式' : '9:16 直式';

    const lines = [
      '【吃貨哲學家｜10秒有聲城市明信片設計表】',
      '• 創作署名：' + getCourseCreditLine(),
      '• 採集店家與品項：' + state.location + '「' + state.shop + '」— ' + state.food + '（' + state.sensoryTag + '）',
      '• 吃貨哲學金句：「' + state.quote + '」',
      '• 視覺與聲音參數：' + aspectText + '｜' + (camMap[state.cam] || '溫柔推近') + '｜' + (moodMap[state.mood] || '晴朗晨光') + '｜' + (sensoryMap[state.sensory] || '熱氣蒸騰') + '｜' + state.audioFileName,
      '──────────────────────────'
    ];

    if (state.route === 'route') {
      lines.push('[00.0s - 02.2s] Shot 1 起點：俯視紙地圖推近「國立基隆商工」立體紙雕彈起。');
      lines.push('[02.2s - 04.2s] Shot 2 尋味：沿七堵街區滑軌移動，掠過「七堵慶濟宮」信仰地標。');
      lines.push('[04.2s - 10.0s] Shot 3 悟道：「' + state.food + '」明信片立體彈起，搭配' + (sensoryMap[state.sensory] || '熱氣蒸騰') + '特效，金句逐字浮現並蓋上郵戳定格。');
    } else {
      lines.push('[00.0s - 01.6s] Shot 1 凝視：全幅聚焦紙地圖，「' + state.food + '」立體明信片緩緩彈起。');
      lines.push('[01.6s - 08.0s] Shot 2 細節：' + (camMap[state.cam] || '溫柔推近') + '運鏡搭配' + (sensoryMap[state.sensory] || '熱氣蒸騰') + '，吃貨哲學金句逐字浮現。');
      lines.push('[08.0s - 10.0s] Shot 3 落款：展示完整郵戳與課程協作署名，配樂淡出定格。');
    }

    const outEl = document.getElementById('storyboardOutput');
    if (outEl) outEl.textContent = lines.join('\n');
  }

  // 立即生成第一版設計表
  updateStoryboardSheet();

  document.getElementById('btnCopyPlan').addEventListener('click', () => {
    const text = document.getElementById('storyboardOutput').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        statusEl.textContent = '✔ 已複製「導演分鏡設計表」！可直接貼進 Classroom 作業說明。';
      });
    }
  });

  // ============================================================================
  // 第二階段：啟動 3D 繪圖引擎（加入雙重相容與錯誤捕捉保護）
  // ============================================================================
  if (typeof THREE === 'undefined') {
    const errBox = document.getElementById('error-overlay');
    errBox.style.display = 'flex';
    errBox.innerHTML = '<strong>無法載入 3D 繪圖引擎 (Three.js)</strong><br>請確認網路連線是否暢通，或重新整理頁面。<br><small>（左側分鏡設計表功能仍可正常使用）</small>';
    return;
  }

  let renderer = null;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  } catch (e1) {
    try {
      // 降級相容模式（關閉抗鋸齒，適配舊電腦或無痕硬體限制）
      renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
    } catch (e2) {
      const errBox = document.getElementById('error-overlay');
      errBox.style.display = 'flex';
      errBox.innerHTML = '<strong>此瀏覽器視窗未開啟 3D 硬體加速 (WebGL)</strong><br>原因：' + e2.message + '<br><small>請改用一般視窗開啟，或至瀏覽器設定開啟「圖形加速 / 硬體加速」。</small>';
      return;
    }
  }

  renderer.setSize(renderW, renderH, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x231f1d);
  scene.fog = new THREE.FogExp2(0x231f1d, 0.008);

  const camera = new THREE.PerspectiveCamera(40, renderW / renderH, 0.1, 300);
  scene.add(camera);

  const hemiLight = new THREE.HemisphereLight(0xfffbeb, 0x44403c, 0.9);
  scene.add(hemiLight);

  const mainLight = new THREE.DirectionalLight(0xfff7ed, 1.35);
  mainLight.position.set(18, 32, 24);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.set(1024, 1024);
  mainLight.shadow.camera.near = 2;
  mainLight.shadow.camera.far = 90;
  const sd = 28;
  mainLight.shadow.camera.left = -sd; mainLight.shadow.camera.right = sd;
  mainLight.shadow.camera.top = sd; mainLight.shadow.camera.bottom = -sd;
  mainLight.shadow.bias = -0.0005;
  scene.add(mainLight);

  const rimLight = new THREE.DirectionalLight(0xbae6fd, 0.45);
  rimLight.position.set(-20, 14, -22);
  scene.add(rimLight);

  function applyMoodLighting() {
    const presets = {
      morning: { bg: 0x29231e, fog: 0.007, hemi: 0xfffbeb, hemiI: 0.95, main: 0xfff3db, mainI: 1.4, rim: 0xfde68a },
      fresh:   { bg: 0x222624, fog: 0.006, hemi: 0xf0fdf4, hemiI: 1.0,  main: 0xffffff, mainI: 1.3, rim: 0xa7f3d0 },
      rain:    { bg: 0x16202a, fog: 0.014, hemi: 0xdbeafe, hemiI: 0.85, main: 0x93c5fd, mainI: 1.1, rim: 0x38bdf8 },

  let audioCtx = null, audioDest = null, masterGain = null;
  let customAudioBuffer = null, customAudioSource = null, customAudioGain = null;

  function initAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.75;
    masterGain.connect(audioCtx.destination);
    if (audioCtx.createMediaStreamDestination) {
      audioDest = audioCtx.createMediaStreamDestination();
      masterGain.connect(audioDest);
    }
  }

  function syncCustomAudio(offsetSec) {
    if (!audioCtx || !customAudioBuffer) return;
    if (customAudioSource) {
      try { customAudioSource.stop(); } catch (_) {}
      customAudioSource.disconnect(); customAudioSource = null;
    }
    if (!isPlaying) return;
    customAudioSource = audioCtx.createBufferSource();
    customAudioSource.buffer = customAudioBuffer; customAudioSource.loop = true;
    customAudioGain = audioCtx.createGain(); customAudioGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    customAudioSource.connect(customAudioGain); customAudioGain.connect(masterGain);
    customAudioSource.start(0, offsetSec % customAudioBuffer.duration);
  }

  const NOTES = [523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 880.00, 783.99];
  function playFallbackNote(step, t) {
    if (!audioCtx || customAudioBuffer) return;
    const now = audioCtx.currentTime, fade = t > 8.2 ? Math.max(0.05, (10 - t) / 1.8) : 1.0;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(NOTES[step % NOTES.length], now);
    g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.15 * fade, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.65);
  }

  function playCardPopSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime, dur = 0.22;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.06));
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 1750;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(masterGain); src.start(now);
  }

  function updateAudio(t) {
    if (!audioCtx || !isPlaying) return;
    if (customAudioGain && t > 8.2) customAudioGain.gain.setTargetAtTime(Math.max(0.02, ((10 - t) / 1.8) * 0.7), audioCtx.currentTime, 0.1);
    const beat = Math.floor(t / 0.625);
    if (beat !== lastBeatIdx) { lastBeatIdx = beat; playFallbackNote(beat, t); }
    const popTrigger = state.route === 'route' ? 4.2 : 0.6;
    if (t >= popTrigger && t < popTrigger + 0.3 && !cardPopPlayed) { cardPopPlayed = true; playCardPopSound(); }
  }

  const easeInOutCubic = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOutBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

  function updateScene(t) {
    const isRoute = state.route === 'route';
    klvsPivot.visible = isRoute;
    qingjiPivot.visible = isRoute;

    if (isRoute) {
      const p1 = Math.min(1, Math.max(0, (t - 0.3) / 0.9));
      klvsPivot.rotation.x = -Math.PI / 2 + (p1 === 0 ? 0 : easeOutBack(p1)) * (Math.PI / 2);

      const p2 = Math.min(1, Math.max(0, (t - 2.2) / 0.9));
      qingjiPivot.rotation.x = -Math.PI / 2 + (p2 === 0 ? 0 : easeOutBack(p2)) * (Math.PI / 2);

      const p3 = Math.min(1, Math.max(0, (t - 4.2) / 1.1));
      foodCardPivot.rotation.x = -Math.PI / 2 + (p3 === 0 ? 0 : easeOutBack(p3)) * (Math.PI / 2);
    } else {
      const pSolo = Math.min(1, Math.max(0, (t - 0.4) / 1.2));
      foodCardPivot.rotation.x = -Math.PI / 2 + (pSolo === 0 ? 0 : easeOutBack(pSolo)) * (Math.PI / 2);
    }

    const textStart = isRoute ? 5.0 : 1.6;
    const textDur = isRoute ? 3.2 : 4.5;
    const qProg = Math.min(1, Math.max(0, (t - textStart) / textDur));
    if (Math.abs(qProg - lastQuoteProgress) > 0.015) {
      lastQuoteProgress = qProg;
      renderPostcardCanvas(qProg);
    }

    const distFactor = state.aspect === 'portrait' ? 1.55 : 1.0;
    let camPos = new THREE.Vector3(1.2, 4.5, 11.5 * distFactor);
    let lookAt = new THREE.Vector3(1.2, 3.1, -1.5);

    if (isRoute) {
      if (t < 2.2) {
        const a = easeInOutCubic(t / 2.2);
        camPos.set(THREE.MathUtils.lerp(-11, -9.5, a), THREE.MathUtils.lerp(11, 4.2, a), THREE.MathUtils.lerp(19, 16.5, a) * distFactor);
        lookAt.set(-9.5, 1.5, 10.5);
        hudShot.textContent = 'Shot 1 起點・國立基隆商工';
      } else if (t < 4.2) {
        const a = easeInOutCubic((t - 2.2) / 2.0);
        camPos.set(THREE.MathUtils.lerp(-9.5, -3.0, a), THREE.MathUtils.lerp(4.2, 3.8, a), THREE.MathUtils.lerp(16.5, 10.5, a) * distFactor);
        lookAt.set(THREE.MathUtils.lerp(-9.5, -3.0, a), 1.6, THREE.MathUtils.lerp(10.5, 3.5, a));
        hudShot.textContent = 'Shot 2 尋味・七堵慶濟宮';
      } else {
        const a = easeInOutCubic((t - 4.2) / 5.8);
        const startZ = 11.2 * distFactor;
        const endZ = (state.cam === 'dolly' ? 8.4 : 9.8) * distFactor;
        const startY = state.cam === 'crane' ? 1.8 : 4.2;
        const endY = state.cam === 'crane' ? 3.6 : 3.3;
        camPos.set(1.2, THREE.MathUtils.lerp(startY, endY, a), THREE.MathUtils.lerp(startZ, endZ, a));
        lookAt.set(1.2, 3.15, -1.5);
        hudShot.textContent = `Shot 3 悟道・${state.food}`;
      }
    } else {
      const a = easeInOutCubic(t / DURATION);
      const startZ = 12.0 * distFactor;
      const endZ = (state.cam === 'dolly' ? 8.2 : 10.0) * distFactor;
      const startY = state.cam === 'crane' ? 1.6 : 4.6;
      const endY = state.cam === 'crane' ? 3.5 : 3.2;
      camPos.set(1.2, THREE.MathUtils.lerp(startY, endY, a), THREE.MathUtils.lerp(startZ, endZ, a));
      lookAt.set(1.2, 3.15, -1.5);
      hudShot.textContent = `純粹凝視・${state.food}`;
    }

    if (state.cam === 'breath') {
      camPos.x += Math.sin(t * 1.8) * 0.14;
      camPos.y += Math.cos(t * 2.2) * 0.09;
    }

    camera.position.copy(camPos);
    camera.lookAt(lookAt);

    updateParticles(t);
    updateAudio(t);

    timeLabel.textContent = `${t.toFixed(1)}s / ${DURATION.toFixed(1)}s`;
    scrubber.value = t;
  }

  // 綁定所有輸入框與下拉選單
  const FIELD_MAP = {
    inLocation: 'location', inShop: 'shop', inFood: 'food',
    inSensoryTag: 'sensoryTag', inAuthor: 'author', inCourse: 'course', inQuote: 'quote'
  };

  Object.entries(FIELD_MAP).forEach(([elId, key]) => {
    const el = document.getElementById(elId);
    el.value = state[key];
    el.addEventListener('input', () => {
      state[key] = el.value;
      saveLocalDraft();
      lastQuoteProgress = -1;
      renderPostcardCanvas(1.0);
      updateStoryboardSheet();
    });
  });

  document.getElementById('selRoute').value = state.route;
  document.getElementById('selAspect').value = state.aspect;
  document.getElementById('selMood').value = state.mood;
  document.getElementById('selSensory').value = state.sensory;
  document.getElementById('selCam').value = state.cam;
  document.getElementById('selFont').value = state.font;

  document.getElementById('btnReset').addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    Object.assign(state, DEFAULT_STATE);
    Object.entries(FIELD_MAP).forEach(([elId, key]) => {
      document.getElementById(elId).value = state[key];
    });
    document.getElementById('selRoute').value = state.route;
    document.getElementById('selAspect').value = state.aspect;
    document.getElementById('selMood').value = state.mood;
    document.getElementById('selSensory').value = state.sensory;
    document.getElementById('selCam').value = state.cam;
    document.getElementById('selFont').value = state.font;
    applyMoodLighting();
    lastQuoteProgress = -1;
    renderPostcardCanvas(1.0);
    updateStoryboardSheet();
    statusEl.textContent = '已清空暫存並恢復預設範例。';
  });

  document.getElementById('photoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        state.userPhotoImg = img;
        lastQuoteProgress = -1;
        renderPostcardCanvas(1.0);
        document.getElementById('lblPhoto').classList.add('loaded');
        document.getElementById('lblPhoto').childNodes[0].textContent = '✔ 已選取照片 ';
        statusEl.textContent = '美食照片已套用至立體明信片！';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('audioInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    initAudio();
    statusEl.textContent = '正在解碼音檔...';
    customAudioBuffer = await audioCtx.decodeAudioData(await file.arrayBuffer());
    state.audioFileName = `AI再製配樂「${file.name}」＋ 紙雕音效`;
    updateStoryboardSheet();
    document.getElementById('lblAudio').classList.add('loaded');
    document.getElementById('lblAudio').childNodes[0].textContent = '✔ 已選取音檔 ';
    statusEl.textContent = `已載入音檔：${file.name}`;
    syncCustomAudio(currentTime);
  });

  document.getElementById('selRoute').addEventListener('change', (e) => {
    state.route = e.target.value; saveLocalDraft();
    cardPopPlayed = false; lastQuoteProgress = -1; updateStoryboardSheet();
  });

  document.getElementById('selAspect').addEventListener('change', (e) => {
    state.aspect = e.target.value; saveLocalDraft();
    wrap.className = state.aspect;
    if (state.aspect === 'landscape') {
      renderW = 1920; renderH = 1080;
      document.getElementById('hudRes').textContent = '1920 × 1080 (16:9)';
    } else {
      renderW = 1080; renderH = 1920;
      document.getElementById('hudRes').textContent = '1080 × 1920 (9:16)';
    }
    camera.aspect = renderW / renderH;
    camera.updateProjectionMatrix();
    renderer.setSize(renderW, renderH, false);
    updateStoryboardSheet();
  });

  document.getElementById('selCam').addEventListener('change', (e) => {
    state.cam = e.target.value; saveLocalDraft(); updateStoryboardSheet();
  });

  document.getElementById('selMood').addEventListener('change', (e) => {
    state.mood = e.target.value; saveLocalDraft(); applyMoodLighting(); updateStoryboardSheet();
  });

  document.getElementById('selSensory').addEventListener('change', (e) => {
    state.sensory = e.target.value; saveLocalDraft(); applyMoodLighting(); updateStoryboardSheet();
  });

  document.getElementById('selFont').addEventListener('change', (e) => {
    state.font = e.target.value; saveLocalDraft(); lastQuoteProgress = -1; renderPostcardCanvas(1.0);
  });

  document.getElementById('btnPlay').addEventListener('click', () => {
    if (isRecording) return;
    initAudio();
    isPlaying = !isPlaying;
    lastMs = performance.now();
    syncCustomAudio(currentTime);
  });

  scrubber.addEventListener('input', (e) => {
    if (isRecording) return;
    initAudio();
    isPlaying = false;
    currentTime = parseFloat(e.target.value);
    lastBeatIdx = -1; cardPopPlayed = false;
    syncCustomAudio(currentTime);
    updateScene(currentTime);
    renderer.render(scene, camera);
  });

  const btnRecord = document.getElementById('btnRecord');
  btnRecord.addEventListener('click', () => {
    if (isRecording) return;
    initAudio();

    if (typeof MediaRecorder === 'undefined' || !renderer.domElement.captureStream) {
      statusEl.textContent = '此瀏覽器不支援直接錄製，請按「播放」後使用內建「螢幕錄影」錄下上方 10 秒畫面！';
      return;
    }

    isRecording = true; isPlaying = true; currentTime = 0;
    btnRecord.disabled = true;
    lastBeatIdx = -1; cardPopPlayed = false; lastQuoteProgress = -1;
    syncCustomAudio(0);

    statusEl.textContent = `正在錄製 10 秒明信片 (${renderW}×${renderH})...`;

    const videoStream = renderer.domElement.captureStream(60);
    const tracks = [...videoStream.getVideoTracks()];
    if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
      tracks.push(...audioDest.stream.getAudioTracks());
    }
    const combined = new MediaStream(tracks);

    const mime = [
      'video/mp4; codecs="avc1.42E01E, mp4a.40.2"',
      'video/mp4',
      'video/webm; codecs="vp9, opus"',
      'video/webm'
    ].find(m => MediaRecorder.isTypeSupported(m)) || '';

    const recorder = new MediaRecorder(combined, {
      mimeType: mime,
      videoBitsPerSecond: 14_000_000,
      audioBitsPerSecond: 192_000
    });

    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: mime || 'video/mp4' }));
      a.download = `吃貨哲學家_${state.shop}_${state.food}.${ext}`;
      a.click();
      isRecording = false; btnRecord.disabled = false;
      if (customAudioSource) { try { customAudioSource.stop(); } catch (_) {} }
      statusEl.textContent = '匯出成功！若手機無聲音請改用手機「螢幕錄影」錄下上方 10 秒畫面。';
    };

    recorder.start();
    lastMs = performance.now();

    const timer = setInterval(() => {
      if (currentTime >= DURATION) {
        clearInterval(timer);
        setTimeout(() => recorder.stop(), 180);
      }
    }, 80);
  });

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = (now - lastMs) / 1000;
    lastMs = now;
    if (isPlaying) {
      currentTime += dt;
      if (currentTime > DURATION) {
        if (isRecording) {
          currentTime = DURATION;
        } else {
          currentTime = 0;
          lastBeatIdx = -1; cardPopPlayed = false;
          syncCustomAudio(0);
        }
      }
    }
    updateScene(currentTime);
    renderer.render(scene, camera);
  }

  applyMoodLighting();
  renderPostcardCanvas(1.0);
  updateScene(0);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
