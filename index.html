<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>吃貨哲學家｜10秒有聲數位城市明信片生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121214; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
      display: flex; height: 100dvh; overflow: hidden;
    }

    /* 電腦版：左右並排（左操作、右預覽） */
    #sidebar {
      width: 410px; background: #1c1c20; border-right: 1px solid #2e2e34;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      z-index: 10; overflow-y: auto; flex-shrink: 0;
    }
    #stage {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #09090b; position: relative; padding: 16px;
    }

    /* 手機與平板直式版：上下分割（上預覽固定、下操作捲動） */
    @media (max-width: 850px) {
      body { flex-direction: column-reverse; }
      #stage {
        flex: none; height: 38dvh; width: 100%; padding: 8px 12px;
        border-bottom: 1px solid #2e2e34;
      }
      #sidebar {
        width: 100%; height: 62dvh; border-right: none;
        padding: 14px; gap: 10px;
      }
      #canvas-wrap.landscape { width: auto !important; height: 82% !important; aspect-ratio: 16 / 9; }
      #canvas-wrap.portrait { height: 86% !important; width: auto !important; aspect-ratio: 9 / 16; }
      #hud-bar { margin-top: 5px; font-size: 11px; gap: 10px; }
    }

    .header-box {
      border-bottom: 1px solid #2e2e34; padding-bottom: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    h1 { font-size: 17px; color: #fbbf24; letter-spacing: 1px; }
    .sub { font-size: 11.5px; color: #a1a1aa; margin-top: 2px; }

    .section {
      background: #25252a; border-radius: 8px; padding: 11px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sec-title {
      font-size: 12.5px; font-weight: 700; color: #e4e4e7;
      display: flex; justify-content: space-between; align-items: center;
    }
    .badge {
      background: #3f3f46; color: #fbbf24; font-size: 10.5px;
      padding: 2px 6px; border-radius: 4px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11.5px; color: #a1a1aa; }
    input[type="text"], textarea, select {
      background: #161619; border: 1px solid #3f3f46; border-radius: 6px;
      color: #f4f4f5; padding: 7px 9px; font-size: 12.5px; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #fbbf24; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .file-btn {
      background: #2e2e36; border: 1px dashed #52525b; border-radius: 6px;
      padding: 9px 8px; font-size: 12.5px; color: #e4e4e7; cursor: pointer;
      text-align: center; transition: 0.2s; display: block;
    }
    .file-btn:hover { border-color: #fbbf24; color: #fbbf24; }
    .file-btn.loaded { border-style: solid; border-color: #10b981; color: #34d399; background: rgba(16, 185, 129, 0.08); }

    .storyboard-box {
      background: #161619; border: 1px solid #3f3f46; border-radius: 6px;
      padding: 8px; font-size: 11.5px; color: #d4d4d8; line-height: 1.5;
      white-space: pre-line; max-height: 130px; overflow-y: auto;
    }
    .btn-mini {
      background: #3f3f46; color: #fbbf24; border: none; border-radius: 4px;
      padding: 4px 9px; font-size: 11px; cursor: pointer; font-weight: 600;
    }
    .btn-mini:hover { background: #52525b; }
    .btn-reset {
      background: #2e2e36; color: #a1a1aa; border: 1px solid #3f3f46;
      border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .btn-reset:hover { color: #f87171; border-color: #f87171; }

    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 6px;
      font-weight: 700; font-size: 13.5px; cursor: pointer; transition: 0.2s;
    }
    #btnPlay { background: #3b82f6; color: white; }
    #btnPlay:hover { background: #2563eb; }
    #btnRecord { background: #ef4444; color: white; }
    #btnRecord:hover { background: #dc2626; }
    #btnRecord:disabled { background: #52525b; cursor: not-allowed; }
    input[type="range"] { width: 100%; accent-color: #fbbf24; height: 22px; }

    #canvas-wrap {
      box-shadow: 0 20px 55px rgba(0,0,0,0.9);
      border: 1px solid #3f3f46; overflow: hidden; background: #000;
      transition: all 0.3s ease;
    }
    #canvas-wrap.landscape { width: min(88%, 1040px); aspect-ratio: 16 / 9; }
    #canvas-wrap.portrait { height: 86vh; aspect-ratio: 9 / 16; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
    #hud-bar {
      margin-top: 8px; font-size: 12px; color: #a1a1aa;
      display: flex; gap: 18px; align-items: center;
    }
    #status { font-size: 12px; color: #34d399; line-height: 1.45; min-height: 18px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div class="header-box">
      <div>
        <h1>吃貨哲學家｜10秒有聲城市明信片</h1>
        <div class="sub">1照片 ＋ 1音檔 ＋ 1金句 · 人機協作多模態產出</div>
      </div>
      <button id="btnReset" class="btn-reset" title="清除暫存恢復預設值">清空重填</button>
    </div>

    <!-- 1. 採集素材上傳 -->
    <div class="section">
      <div class="sec-title"><span>1. 上傳採集素材</span><span class="badge">照片 + 配樂</span></div>
      <div class="grid-2">
        <label id="lblPhoto" class="file-btn">
          選取美食照片
          <input type="file" id="photoInput" accept="image/*" style="display:none;" />
        </label>
        <label id="lblAudio" class="file-btn">
          選取AI配樂音檔 (選用)
          <input type="file" id="audioInput" accept="audio/*" style="display:none;" />
        </label>
      </div>
    </div>

    <!-- 2. 明信片文案與課程版協作標註 -->
    <div class="section">
      <div class="sec-title"><span>2. 明信片文案與課程版標註</span><span class="badge">直接印上明信片</span></div>
      <div class="grid-2">
        <div class="field">
          <label>地點標記</label>
          <input type="text" id="inLocation" value="基隆七堵" />
        </div>
        <div class="field">
          <label>採集店家名稱</label>
          <input type="text" id="inShop" value="橙憶饅鰻早午餐店" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>美食名稱（料理品項）</label>
          <input type="text" id="inFood" value="豬里肌雞蛋餅" />
        </div>
        <div class="field">
          <label>自訂現場感官關鍵字（副標）</label>
          <input type="text" id="inSensoryTag" value="微雨清晨 · 焦香酥脆" />
        </div>
      </div>
      <div class="field">
        <label>吃貨哲學金句（人機協作共創）</label>
        <textarea id="inQuote" rows="2">如油煎脆皮，有了裂隙，才淌出豐潤多汁。</textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>吃貨（班級座號／姓名）</label>
          <input type="text" id="inAuthor" value="商一甲 01 號 王小明" />
        </div>
        <div class="field">
          <label>課程名稱前綴</label>
          <input type="text" id="inCourse" value="基隆商工《吃貨哲學家》" />
        </div>
      </div>
    </div>

    <!-- 3. 自由光影與感官視覺設計 -->
    <div class="section">
      <div class="sec-title"><span>3. 自由光影與感官視覺設計</span><span class="badge">冷熱甜鹹皆可搭</span></div>
      <div class="grid-2">
        <div class="field">
          <label>敘事路線結構</label>
          <select id="selRoute">
            <option value="route">三站尋味（商工→慶濟宮→美食）</option>
            <option value="solo">純粹凝視（單張美食微距）</option>
          </select>
        </div>
        <div class="field">
          <label>輸出畫面比例</label>
          <select id="selAspect">
            <option value="landscape">16:9 橫式明信片</option>
            <option value="portrait">9:16 直式短影音</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>光影色溫調色盤</label>
          <select id="selMood">
            <option value="morning">晴朗晨光（暖白明媚）</option>
            <option value="fresh">清新自然（柔和日常）</option>
            <option value="rain">陰雨濕潤（冷藍微霧）</option>
            <option value="sunset">黃昏夕照（橘紅餘暉）</option>
            <option value="night">深夜暖燈（暗調聚光）</option>
          </select>
        </div>
        <div class="field">
          <label>食物感官物理粒子</label>
          <select id="selSensory">
            <option value="steam">熱氣蒸騰（熱食升溫蒸汽）</option>
            <option value="crisp">油亮金光（炸烤酥脆星芒）</option>
            <option value="chill">沁涼寒氣（冰品冷飲下沉霧）</option>
            <option value="sweet">糖霜微塵（甜點溫潤光點）</option>
            <option value="none">純淨寫實（無粒子特效）</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>運鏡語法</label>
          <select id="selCam">
            <option value="dolly">溫柔推近（聚焦細節）</option>
            <option value="breath">微幅呼吸（手持溫度）</option>
            <option value="crane">低角仰望（崇高儀式）</option>
          </select>
        </div>
        <div class="field">
          <label>金句字體氣質</label>
          <select id="selFont">
            <option value="serif">典雅明體（思辨哲理）</option>
            <option value="maru">圓潤手寫（日常溫度）</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 4. 自動生成的影片設計表 -->
    <div class="section">
      <div class="sec-title">
        <span>4. 本片導演分鏡設計表（自動同步）</span>
        <button id="btnCopyPlan" class="btn-mini">複製設計表</button>
      </div>
      <div id="storyboardOutput" class="storyboard-box"></div>
    </div>

    <!-- 5. 預覽與匯出 -->
    <div class="section">
      <div class="sec-title">
        <span>5. 預覽與輸出影片</span>
        <strong id="timeLabel" style="color:#fbbf24;">00.0s / 10.0s</strong>
      </div>
      <input type="range" id="scrubber" min="0" max="10" step="0.05" value="0" />
      <div class="grid-2">
        <button id="btnPlay" class="btn">暫停 / 播放</button>
        <button id="btnRecord" class="btn">匯出 10 秒影片</button>
      </div>
      <div id="status">準備就緒！輸入內容會自動暫存於此裝置，避免誤關遺失。</div>
    </div>
  </div>

  <div id="stage">
    <div id="canvas-wrap" class="landscape"></div>
    <div id="hud-bar">
      <span id="hudShot">Shot 1 起點・國立基隆商工</span>
      <span id="hudRes">1920 × 1080 (16:9)</span>
    </div>
  </div>

<script>
const DURATION = 10.0;
let renderW = 1920;
let renderH = 1080;

const DEFAULT_STATE = {
  route: 'route',
  aspect: 'landscape',
  cam: 'dolly',
  mood: 'morning',
  sensory: 'steam',
  font: 'serif',
  location: '基隆七堵',
  shop: '橙憶饅鰻早午餐店',
  food: '豬里肌雞蛋餅',
  sensoryTag: '微雨清晨 · 焦香酥脆',
  author: '商一甲 01 號 王小明',
  course: '基隆商工《吃貨哲學家》',
  quote: '如油煎脆皮，有了裂隙，才淌出豐潤多汁。'
};

const state = {
  ...DEFAULT_STATE,
  userPhotoImg: null,
  audioFileName: '系統內建柔和木琴與紙雕音效'
};

// 讀取本機瀏覽器暫存（防止學生誤重整頁面）
const STORAGE_KEY = 'foodie_philosopher_postcard_v2';
function loadLocalDraft() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) Object.assign(state, saved);
  } catch (_) {}
}
function saveLocalDraft() {
  try {
    const toSave = {};
    Object.keys(DEFAULT_STATE).forEach(k => { toSave[k] = state[k]; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (_) {}
}
loadLocalDraft();

// 組合標準課程版協作標註字串
function getCourseCreditLine() {
  const coursePrefix = (state.course || '基隆商工《吃貨哲學家》').trim();
  const eaterName = (state.author || '吃貨').trim();
  return `${coursePrefix}｜ ${eaterName} × AI 協作創作`;
}

const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(renderW, renderH, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x231f1d);
scene.fog = new THREE.FogExp2(0x231f1d, 0.008);

const camera = new THREE.PerspectiveCamera(40, renderW / renderH, 0.1, 300);
scene.add(camera);

const hemiLight = new THREE.HemisphereLight(0xfffbeb, 0x44403c, 0.9);
scene.add(hemiLight);

const mainLight = new THREE.DirectionalLight(0xfff7ed, 1.35);
mainLight.position.set(18, 32, 24);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
mainLight.shadow.camera.near = 2;
mainLight.shadow.camera.far = 90;
const sd = 28;
mainLight.shadow.camera.left = -sd; mainLight.shadow.camera.right = sd;
mainLight.shadow.camera.top = sd; mainLight.shadow.camera.bottom = -sd;
mainLight.shadow.bias = -0.0005;
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0xbae6fd, 0.45);
rimLight.position.set(-20, 14, -22);
scene.add(rimLight);

function applyMoodLighting() {
  const presets = {
    morning: { bg: 0x29231e, fog: 0.007, hemi: 0xfffbeb, hemiI: 0.95, main: 0xfff3db, mainI: 1.4, rim: 0xfde68a },
    fresh:   { bg: 0x222624, fog: 0.006, hemi: 0xf0fdf4, hemiI: 1.0,  main: 0xffffff, mainI: 1.3, rim: 0xa7f3d0 },
    rain:    { bg: 0x16202a, fog: 0.014, hemi: 0xdbeafe, hemiI: 0.85, main: 0x93c5fd, mainI: 1.1, rim: 0x38bdf8 },
    sunset:  { bg: 0x2c1a16, fog: 0.009, hemi: 0xffedd5, hemiI: 0.9,  main: 0xfdba74, mainI: 1.45,rim: 0xf43f5e },
    night:   { bg: 0x121013, fog: 0.012, hemi: 0x78350f, hemiI: 0.55, main: 0xfbbf24, mainI: 1.65,rim: 0xf97316 }
  };
  const p = presets[state.mood] || presets.morning;
  scene.background.setHex(p.bg);
  scene.fog.color.setHex(p.bg);
  scene.fog.density = p.fog;
  hemiLight.color.setHex(p.hemi);
  hemiLight.intensity = p.hemiI;
  mainLight.color.setHex(p.main);
  mainLight.intensity = state.sensory === 'crisp' ? p.mainI + 0.22 : p.mainI;
  rimLight.color.setHex(p.rim);
}

function createWoodTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a3222'; ctx.fillRect(0, 0,
